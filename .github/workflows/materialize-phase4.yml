name: Materialize Phase 4 implementation

on:
  push:
    branches: [agents/phase4-jurisdiction-library]
    paths: [.github/workflows/materialize-phase4.yml]

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agents/phase4-jurisdiction-library
          fetch-depth: 0
      - name: Verify and extract reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/phase4.part-* | base64 --decode > /tmp/civic-phase4.tar.xz
          echo '6c28ebf3cb247f92ae7fc60573b7e20ec04b6490a9855842488da634e099c6cf  /tmp/civic-phase4.tar.xz' | sha256sum --check
          tar -xJf /tmp/civic-phase4.tar.xz -C .
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test materialized implementation
        run: |
          npm test
          npm run check
          npm run validate:example
      - name: Commit implementation and remove one-shot payload
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .bootstrap
          rm .github/workflows/materialize-phase4.yml
          git config user.name 'civic-relay-agents'
          git config user.email '3990503+kuil09@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add jurisdiction adapters and public case library (#26 #27)'
          git push origin HEAD:agents/phase4-jurisdiction-library
